[package]
name = "ocean-calc-wasm"
version = "0.1.0"
edition = "2024"
description = "Bounded JSON facade for the existing evidence-scoped OceanCalc core"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ocean-calc = { path = "../ocean-calc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

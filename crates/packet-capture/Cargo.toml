[package]
name = "inkscope"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
aes = "0.9.3"
aes-gcm = { version = "0.11.1", features = ["hazmat"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
ctrlc = { version = "3.4", features = ["termination"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = "0.30.0"
uuid = { version = "1.29.0", features = ["v4"] }
zstd = "0.13.3"
zstd-safe = "7.3"
zeroize = "1.9.1"
ocean-calc = { path = "../ocean-calc" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
